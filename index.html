<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苏晓萍习惯打卡</title>
<meta name="theme-color" content="#F5F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习惯打卡">
<style>
:root {
  --bg: #F5F3EF;
  --surface: #FFFFFF;
  --ink: #2C2118;
  --ink-2: #5B4B3D;
  --muted: #A29788;
  --faint: #C9BFB0;
  --line: #ECE6DC;
  --line-soft: #F1ECE4;
  --accent: #E2603B;
  --accent-deep: #C94C2B;
  --accent-soft: #FBE8E0;
  --grad-accent: linear-gradient(135deg, #F0805A 0%, #DE5A34 100%);
  --done: #2A9D6F;
  --done-deep: #1F8057;
  --done-soft: #E3F2EA;
  --grad-done: linear-gradient(135deg, #43B57F 0%, #1F8F60 100%);
  --shadow-card: 0 1px 2px rgba(44,33,24,.04), 0 10px 24px -14px rgba(44,33,24,.16);
  --shadow-float: 0 2px 4px rgba(44,33,24,.04), 0 18px 34px -14px rgba(44,33,24,.20);
  --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  background:
    radial-gradient(920px 500px at 88% -6%, rgba(226,96,59,.075), transparent 62%),
    radial-gradient(760px 440px at -10% 106%, rgba(42,157,111,.06), transparent 62%),
    var(--bg);
  color: var(--ink);
  display: flex; justify-content: center;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
.app { width: 100%; max-width: 460px; }

/* ===== 顶部卡片 ===== */
header {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, #FFFDFB 0%, #FFFFFF 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 22px 22px 18px;
  animation: rise .5s cubic-bezier(.2,.8,.25,1) both;
}
header::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), #F0A45C);
}
header::after {
  content: ""; position: absolute; width: 210px; height: 210px;
  right: -80px; top: -120px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(226,96,59,.10), transparent 68%);
}
.date {
  position: relative; z-index: 1;
  margin: 2px 0 12px; font-size: 12.5px; font-weight: 700;
  letter-spacing: .4px; color: var(--accent-deep);
  display: flex; align-items: center;
}
.date::before {
  content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 8px; background: var(--grad-accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
h1 {
  position: relative; z-index: 1;
  margin: 0 0 14px; font-size: 23px; font-weight: 800; letter-spacing: .2px;
  color: var(--ink);
}
.summary { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 4px; }
.count {
  font-size: 44px; font-weight: 800; line-height: 1;
  letter-spacing: -1px; color: var(--ink); font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline;
}
#doneCount { color: var(--accent-deep); }
.slash { font-size: .5em; font-weight: 600; color: var(--faint); margin: 0 .14em; }
#totalCount { font-size: .52em; font-weight: 700; color: var(--muted); }
.unit { font-size: .32em; font-weight: 700; color: var(--muted); margin-left: .3em; letter-spacing: 0; }
.hint {
  position: relative; z-index: 1;
  margin: 12px 0 0; font-size: 13px; color: var(--ink-2);
}
.bar {
  position: relative; z-index: 1;
  margin-top: 14px; height: 7px; border-radius: 99px;
  background: #F2ECE3; overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(44,33,24,.05);
}
.bar-fill {
  height: 100%; width: 0; border-radius: 99px;
  background: var(--grad-accent);
  box-shadow: 0 0 12px rgba(226,96,59,.4);
  transition: width .5s cubic-bezier(.22,.9,.36,1);
}
/* ===== 本周统计 ===== */
.week { position: relative; z-index: 1; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.week-head { margin-bottom: 4px; }
.week-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 800; letter-spacing: 1.6px; color: var(--muted);
}
.week-title::before { content: ""; width: 4px; height: 13px; border-radius: 3px; background: var(--grad-accent); }
.week-bar-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.week-bar-label { flex: none; width: 32px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.week-bar { flex: 1; height: 7px; border-radius: 99px; background: #F2ECE3; overflow: hidden; box-shadow: inset 0 1px 2px rgba(44,33,24,.05); }
.week-bar-fill {
  height: 100%; width: 0; border-radius: 99px; background: var(--grad-done);
  transition: width .5s cubic-bezier(.22,.9,.36,1);
}
.week .week-bar-row:nth-child(2) .week-bar-fill { background: var(--grad-accent); box-shadow: 0 0 10px rgba(226,96,59,.35); }
.week .week-bar-row:nth-child(3) .week-bar-fill { box-shadow: 0 0 10px rgba(42,157,111,.3); }
.week-bar-num { flex: none; min-width: 52px; text-align: right; font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.week-days { display: flex; margin-top: 15px; }
.wday { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wdot {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid #E2D8C9; background: #FDFCFA;
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s ease, background .25s ease, border-color .25s ease;
}
.wlabel { font-size: 11px; font-weight: 600; color: var(--muted); transition: color .2s; }
.wday.done .wdot {
  background: var(--grad-done); border-color: transparent;
  box-shadow: 0 4px 10px -5px rgba(31,143,96,.7);
}
.wday.done .wdot::after {
  content: ""; width: 9px; height: 5px; margin-top: -2px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg);
}
.wday.done .wlabel { color: var(--done-deep); }
.wday.today .wdot { box-shadow: 0 0 0 3px var(--accent-soft); }
.wday.today:not(.done) .wdot { border-color: var(--accent); }
.wday.today .wlabel { color: var(--accent-deep); font-weight: 800; }
.wday.future .wdot, .wday.future .wlabel { opacity: .32; }

/* ===== 习惯列表 ===== */
.list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.habit-item {
  display: flex; align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
  animation: pop .35s cubic-bezier(.2,.8,.25,1) both;
  transition: transform .18s ease, box-shadow .18s ease, border-color .25s ease, background .25s ease;
}
.habit-item.done { background: linear-gradient(180deg, #FFFFFF, #FBFCF8); }
.habit-item:active { transform: scale(.985); }
.habit-item.removing { opacity: 0; transform: translateX(26px); }
.habit { display: flex; align-items: center; flex: 1; gap: 13px; padding: 15px 2px 15px 17px; cursor: pointer; min-width: 0; position: relative; }
.habit input { position: absolute; opacity: 0; pointer-events: none; }
.check {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid #DED4C5; background: #FFFFFF;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 2px rgba(44,33,24,.03);
  transition: border-color .2s ease, background .25s ease, box-shadow .25s ease, transform .2s ease;
}
.check svg { width: 15px; height: 15px; opacity: 0; transform: scale(.3); transition: all .25s cubic-bezier(.2,.8,.25,1); }
.habit.checked .check {
  background: var(--grad-done); border-color: transparent;
  box-shadow: 0 6px 14px -6px rgba(31,143,96,.6);
  animation: checkPop .35s cubic-bezier(.2,.8,.25,1);
}
.habit.checked .check svg { opacity: 1; transform: scale(1); }
.name { font-size: 16px; font-weight: 600; line-height: 1.45; word-break: break-word; transition: color .2s ease; color: var(--ink); }
.habit.checked .name {
  color: #B7AB9C;
  text-decoration: line-through;
  text-decoration-color: rgba(183,171,156,.75);
  text-decoration-thickness: 1.5px;
}
.del {
  flex: none; border: none; background: transparent; cursor: pointer;
  width: 40px; height: 40px; margin-right: 7px; font-size: 14px; color: #D2C6B6;
  border-radius: 12px; transition: color .15s ease, background .15s ease;
}
.del:hover { color: #D94F4F; background: #FDEEEE; }
.undo {
  flex: none; border: none; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600; color: #8B7C6D;
  height: 34px; padding: 0 13px; margin-right: 4px; border-radius: 99px;
  background: #F6F2EB; transition: color .15s ease, background .15s ease;
}
.undo:hover { background: var(--accent-soft); color: var(--accent-deep); }
.undo:active { transform: scale(.96); }
.habit-item:not(.done) .undo { display: none; }
.habit-item.done .undo { display: inline-flex; align-items: center; }

/* ===== 空状态 ===== */
.empty {
  margin-top: 24px; text-align: center; color: var(--muted);
  background: rgba(255,255,255,.72); border: 1.5px dashed #DDD2C2;
  border-radius: var(--r-md); padding: 34px 20px; font-size: 14.5px; line-height: 1.9;
}
.empty .big { font-size: 36px; margin-bottom: 4px; }

/* ===== 底部添加栏 ===== */
.add {
  margin-top: 22px; display: flex; align-items: center; gap: 6px;
  position: sticky; bottom: calc(14px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid var(--line); border-radius: 99px;
  padding: 7px 7px 7px 20px;
  box-shadow: var(--shadow-float);
  transition: border-color .2s ease, box-shadow .2s ease;
  z-index: 5;
}
.add:focus-within { border-color: #ECBBA6; box-shadow: 0 0 0 4px rgba(226,96,59,.10), var(--shadow-float); }
.add input { flex: 1; min-width: 0; border: none; outline: none; font-size: 15.5px; font-family: inherit; color: var(--ink); background: transparent; padding: 11px 4px; }
.add input::placeholder { color: #C4B8A8; }
.add button {
  flex: none; border: none; cursor: pointer;
  background: var(--grad-accent); color: #fff;
  font-size: 15px; font-weight: 700; font-family: inherit;
  padding: 11px 22px; border-radius: 99px;
  box-shadow: 0 8px 16px -8px rgba(222,90,52,.7);
  transition: filter .15s ease, transform .1s ease, box-shadow .15s ease;
}
.add button:hover { filter: brightness(1.05); }
.add button:active { transform: scale(.96); }

/* ===== 最近 10 天记录 ===== */
.history { margin-top: 30px; animation: rise .5s .05s cubic-bezier(.2,.8,.25,1) both; }
.history h2 {
  font-size: 16px; margin: 0 0 4px; color: var(--ink);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.history .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
.legend {
  margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--muted);
  display: inline-flex; align-items: center; gap: 7px;
  background: #F6F2EB; border: 1px solid var(--line-soft);
  padding: 4px 12px; border-radius: 99px;
}
.legend .mark { margin-right: 1px; }
.hgrid-wrap {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-card); overflow-x: auto; padding: 12px 8px;
}
.hgrid {
  display: grid;
  grid-template-columns: 88px repeat(10, minmax(22px, 1fr)) 48px;
  min-width: 372px; width: 100%; row-gap: 2px;
}
.hrow { display: contents; }
.hcell {
  display: flex; align-items: center; justify-content: center;
  padding: 7px 0; border-radius: 8px;
  font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.hcell.hdate { flex-direction: column; gap: 1px; }
.hcell.hdate b { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.hcell.hdate span { font-size: 9.5px; color: var(--faint); }
.hcell.nowcol { background: rgba(226,96,59,.065); }
.hcell.hdate.nowcol b { color: var(--accent-deep); }
.hcell.hdate.nowcol span { color: var(--accent); font-weight: 600; }
.hname {
  display: flex; align-items: center;
  padding: 7px 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hhead .hname { font-weight: 800; color: var(--muted); font-size: 11.5px; letter-spacing: .4px; }
.hsum {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 1px;
  font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.hsum b { font-size: 12.5px; color: var(--accent-deep); }
.hrow.hbody .hsum b { color: var(--done-deep); }
.mark { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; }
.mark.on { background: var(--grad-done); box-shadow: 0 3px 8px -4px rgba(31,143,96,.7); }
.mark.off { border: 1.5px solid #E4DACB; background: #FBFAF7; }
.legend .mark { width: 10px; height: 10px; vertical-align: -1px; }
.hfoot .hcell, .hfoot .hname, .hfoot .hsum {
  border-top: 1px dashed #E8E0D3; margin-top: 6px; padding-top: 9px;
}
.hfoot .hcell { font-size: 10.5px; font-weight: 700; color: var(--ink-2); }
.hfoot .hcell.nowcol { color: var(--accent-deep); }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  background: rgba(40,31,23,.92); color: #fff;
  padding: 11px 20px; border-radius: 99px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 20;
  max-width: 82vw; text-align: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 14px 30px -10px rgba(0,0,0,.4);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes checkPop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

button:focus-visible, input:focus-visible, .habit:focus-visible {
  outline: 2px solid rgba(226,96,59,.55); outline-offset: 2px;
}
.hgrid-wrap::-webkit-scrollbar { height: 6px; }
.hgrid-wrap::-webkit-scrollbar-thumb { background: #DDD2C2; border-radius: 99px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
  <main class="app">
    <header>
      <p class="date" id="dateText"></p>
      <h1>习惯打卡</h1>
      <div class="summary">
        <div class="count"><span id="doneCount">0</span><span class="slash">/</span><span id="totalCount">0</span><span class="unit">项</span></div>
      </div>
      <p class="hint" id="doneHint">今天还没有完成，开始第一项吧 💪</p>
      <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
      <div class="week" id="weekBlock">
        <div class="week-head"><span class="week-title">本周打卡</span></div>
        <div class="week-bar-row">
          <span class="week-bar-label">完成</span>
          <div class="week-bar"><div class="week-bar-fill" id="weekDoneBar"></div></div>
          <span class="week-bar-num" id="weekDoneNum">0/0</span>
        </div>
        <div class="week-bar-row">
          <span class="week-bar-label">天数</span>
          <div class="week-bar"><div class="week-bar-fill" id="weekDaysBar"></div></div>
          <span class="week-bar-num" id="weekDaysNum">0/0</span>
        </div>
        <div class="week-days" id="weekDays"></div>
      </div>
    </header>

    <section class="list" id="habitList"></section>

    <div class="empty" id="emptyState" hidden>
      <div class="big">🌱</div>
      <div>还没有习惯。<br>在下面输入第一个想坚持的习惯吧！</div>
    </div>

    <form class="add" id="addForm" autocomplete="off">
      <input id="newHabit" type="text" maxlength="30" placeholder="添加习惯，如：读书 10 分钟">
      <button type="submit">添加</button>
    </form>

    <section class="history" id="historySection" hidden>
      <h2>📅 最近 10 天记录
        <span class="legend"><span class="mark on"></span>已完成 <span class="mark off"></span>未完成</span>
      </h2>
      <p class="sub">含今天，从左到右按日期排列；打钩数据每天自动保留。</p>
      <div class="hgrid-wrap">
        <div class="hgrid" id="historyGrid"></div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var HABITS_KEY = 'daily-habit.habits.v1';
  var LOG_KEY    = 'daily-habit.log.v1';
  var DEFAULT_HABITS = ['读书 10 分钟', '10 点前睡觉', '三餐按时吃饭'];

  var listEl = document.getElementById('habitList');
  var emptyEl = document.getElementById('emptyState');
  var addForm = document.getElementById('addForm');
  var inputEl = document.getElementById('newHabit');
  var dateEl = document.getElementById('dateText');
  var doneCountEl = document.getElementById('doneCount');
  var totalCountEl = document.getElementById('totalCount');
  var hintEl = document.getElementById('doneHint');
  var fillEl = document.getElementById('progressFill');
  var toastEl = document.getElementById('toast');
  var historySectionEl = document.getElementById('historySection');
  var historyGridEl = document.getElementById('historyGrid');
  var weekDoneBarEl = document.getElementById('weekDoneBar');
  var weekDoneNumEl = document.getElementById('weekDoneNum');
  var weekDaysBarEl = document.getElementById('weekDaysBar');
  var weekDaysNumEl = document.getElementById('weekDaysNum');
  var weekDaysEl = document.getElementById('weekDays');
  var weekDaysEl = document.getElementById('weekDays');

  var habits = loadHabits();
  var log = loadLog();
  var toastTimer = null;

  /* ---------- storage helpers ---------- */

  function load(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function loadHabits() {
    var raw = localStorage.getItem(HABITS_KEY);
    if (raw === null) {
      // 第一次打开：预置几个示例习惯，方便直接开始
      var seed = DEFAULT_HABITS.map(function (n, i) { return { id: uid(), name: n, createdAt: Date.now() + i }; });
      save(HABITS_KEY, seed);
      save(LOG_KEY, {});
      return seed;
    }
    var arr = load(HABITS_KEY, []);
    return Array.isArray(arr) ? arr : [];
  }
  function loadLog() {
    var obj = load(LOG_KEY, {});
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  }
  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

  /* ---------- date helpers ---------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function keyOf(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function todayKey() { return keyOf(new Date()); }

  // 最近 n 天（含今天），从旧到新
  function lastDays(n) {
    var out = [];
    var now = new Date();
    now.setHours(12, 0, 0, 0); // 中午，避免夏令时跨天偏差
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(now);
      d.setDate(now.getDate() - i);
      out.push({
        key: keyOf(d),
        md: (d.getMonth() + 1) + '/' + d.getDate(),
        week: '周' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()],
        isToday: i === 0
      });
    }
    return out;
  }

  function renderDate() {
    var d = new Date();
    var week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    dateEl.textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + week;
  }

  /* ---------- rendering ---------- */

  function dayDone(day, habitId) { var o = day || {}; return !!o[habitId]; }
  function todayDone() {
    var day = log[todayKey()] || {};
    var n = 0;
    habits.forEach(function (h) { if (dayDone(day, h.id)) n++; });
    return n;
  }
  function dayCount(dateKey) {
    var day = log[dateKey] || {};
    var n = 0;
    habits.forEach(function (h) { if (dayDone(day, h.id)) n++; });
    return n;
  }

  function render() {
    var done = todayDone();
    var total = habits.length;

    doneCountEl.textContent = done;
    totalCountEl.textContent = total;
    fillEl.style.width = total ? (done / total * 100) + '%' : '0%';

    if (!total) {
      hintEl.textContent = '先添加一个想坚持的习惯吧 🌱';
    } else if (done === 0) {
      hintEl.textContent = '今天还没有完成，开始第一项吧 💪';
    } else if (done < total) {
      hintEl.textContent = '已完成 ' + done + ' 项，继续加油！';
    } else {
      hintEl.textContent = '全部完成，太棒了！🎉';
    }
    renderWeek();
  }

  function renderList() {
    listEl.innerHTML = '';
    habits.forEach(function (h) { listEl.appendChild(buildItem(h)); });
    emptyEl.hidden = habits.length > 0;
    render();
  }

  function buildItem(h) {
    var day = log[todayKey()] || {};
    var checked = !!day[h.id];

    var item = document.createElement('div');
    item.className = 'habit-item' + (checked ? ' done' : '');
    item.dataset.id = h.id;

    var label = document.createElement('label');
    label.className = 'habit' + (checked ? ' checked' : '');

    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;
    cb.setAttribute('aria-label', (checked ? '已完成：' : '完成：') + h.name);
    label.appendChild(cb);

    var check = document.createElement('span');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
    label.appendChild(check);

    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = h.name;
    label.appendChild(name);

    var del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.title = '删除习惯';
    del.setAttribute('aria-label', '删除习惯：' + h.name);
    del.textContent = '✕';

    var undo = document.createElement('button');
    undo.className = 'undo';
    undo.type = 'button';
    undo.textContent = '撤销';
    undo.title = '撤销今天的勾选';
    undo.setAttribute('aria-label', '撤销今天完成：' + h.name);
    undo.addEventListener('click', function (ev) {
      ev.stopPropagation();
      undoToday(h.id, h.name);
    });

    // 点一下 = 完成打钩；已完成不会再被点掉（要改回请用“撤销”）
    cb.addEventListener('change', function () { finishToday(h.id, h.name); });
    del.addEventListener('click', function (ev) {
      ev.stopPropagation();
      removeHabit(h.id, h.name);
    });

    item.appendChild(label);
    item.appendChild(undo);
    item.appendChild(del);
    return item;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 最近 10 天记录表：习惯 × 日期
  function renderHistory() {
    historySectionEl.hidden = habits.length === 0;
    if (!habits.length) return;

    var days = lastDays(10);
    var today = todayKey();
    var h = '';

    // 表头
    h += '<div class="hrow hhead">';
    h += '<div class="hname">习惯</div>';
    days.forEach(function (d) {
      h += '<div class="hcell hdate' + (d.key === today ? ' nowcol' : '') + '"><b>' + d.md + '</b><span>' + (d.isToday ? '今天' : d.week) + '</span></div>';
    });
    h += '<div class="hsum"><b>达标</b><span>天数</span></div>';
    h += '</div>';

    // 每个习惯一行
    habits.forEach(function (hab) {
      h += '<div class="hrow hbody">';
      h += '<div class="hname" title="' + escapeHtml(hab.name) + '">' + escapeHtml(hab.name) + '</div>';
      var cnt = 0;
      days.forEach(function (d) {
        var done = dayDone(log[d.key], hab.id);
        if (done) cnt++;
        h += '<div class="hcell' + (d.key === today ? ' nowcol' : '') + '"><span class="mark ' + (done ? 'on' : 'off') + '"></span></div>';
      });
      h += '<div class="hsum"><b>' + cnt + '</b>/10</div>';
      h += '</div>';
    });

    // 底部：每天完成几项
    h += '<div class="hrow hfoot">';
    h += '<div class="hname">当日完成</div>';
    days.forEach(function (d) {
      h += '<div class="hcell' + (d.key === today ? ' nowcol' : '') + '">' + dayCount(d.key) + '/' + habits.length + '</div>';
    });
    h += '<div class="hsum"></div>';
    h += '</div>';

    historyGridEl.innerHTML = h;
  }

  /* ---------- 本周统计 ---------- */

  // 本周一 ~ 本周日（周一开始）
  function weekDays() {
    var now = new Date();
    now.setHours(12, 0, 0, 0);
    var dow = now.getDay(); // 0 = 周日
    var diff = (dow === 0 ? -6 : 1 - dow);
    var mon = new Date(now);
    mon.setDate(now.getDate() + diff);
    var labels = ['一', '二', '三', '四', '五', '六', '日'];
    var arr = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon);
      d.setDate(mon.getDate() + i);
      arr.push({ key: keyOf(d), label: labels[i] });
    }
    return arr;
  }

  function renderWeek() {
    var days = weekDays();
    var today = todayKey();
    var total = 0, doneDays = 0, elapsed = 0;
    days.forEach(function (d) {
      if (d.key > today) return; // 未来日期不算
      elapsed++;
      var n = dayCount(d.key);
      total += n;
      if (n > 0) doneDays++;
    });
    // 完成进度 = 本周已完成项数 / (习惯数 × 已过天数)
    var maxTotal = habits.length * elapsed;
    weekDoneBarEl.style.width = (maxTotal ? Math.round(total / maxTotal * 100) : 0) + '%';
    weekDoneNumEl.textContent = total + '/' + maxTotal;
    // 天数进度 = 本周打过卡的天数 / 已过天数
    weekDaysBarEl.style.width = (elapsed ? Math.round(doneDays / elapsed * 100) : 0) + '%';
    weekDaysNumEl.textContent = doneDays + '/' + elapsed;

    var html = '';
    days.forEach(function (d) {
      var cls = 'wday';
      if (d.key === today) {
        cls += ' today';
        if (dayCount(d.key) > 0) cls += ' done';
      } else if (d.key > today) {
        cls += ' future';
      } else if (dayCount(d.key) > 0) {
        cls += ' done';
      }
      html += '<div class="' + cls + '"><span class="wdot"></span><span class="wlabel">' + d.label + '</span></div>';
    });
    weekDaysEl.innerHTML = html;
  }

  /* ---------- actions ---------- */

  function setDoneUI(id, done) {
    var item = listEl.querySelector('.habit-item[data-id="' + CSS.escape(id) + '"]');
    if (!item) return;
    var label = item.querySelector('.habit');
    var cb = item.querySelector('input');
    var nm = label.querySelector('.name').textContent;
    label.classList.toggle('checked', done);
    item.classList.toggle('done', done);
    cb.checked = done;
    cb.setAttribute('aria-label', (done ? '已完成：' : '完成：') + nm);
  }

  // 点一下 = 完成并打钩；已完成的行再点也不会取消
  function finishToday(id, name) {
    var today = todayKey();
    var wasDone = !!(log[today] || {})[id];
    if (!log[today]) log[today] = {};
    log[today][id] = true;
    save(LOG_KEY, log);

    setDoneUI(id, true);
    render();
    renderHistory();

    if (wasDone) {
      showToast('今天已完成啦，再点不会取消哦 ✓');
    } else if (habits.length && todayDone() === habits.length) {
      showToast('全部完成，太棒了！🎉');
    }
  }

  // 只有点“撤销”才取消今天的勾选
  function undoToday(id, name) {
    var today = todayKey();
    if (log[today] && log[today][id]) {
      delete log[today][id];
      save(LOG_KEY, log);
    }
    setDoneUI(id, false);
    render();
    renderHistory();
    showToast('已撤销「' + name + '」今天的勾选');
  }

  function addHabit(name) {
    habits.push({ id: uid(), name: name, createdAt: Date.now() });
    save(HABITS_KEY, habits);
    renderList();
    renderHistory();
    showToast('已添加「' + name + '」');
  }

  function removeHabit(id, name) {
    if (!window.confirm('删除习惯「' + name + '」？')) return;
    habits = habits.filter(function (h) { return h.id !== id; });
    save(HABITS_KEY, habits);
    renderList();
    renderHistory();
    showToast('已删除「' + name + '」');
  }

  /* ---------- toast ---------- */

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------- events ---------- */

  addForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = inputEl.value.trim();
    if (!name) return;
    if (habits.some(function (h) { return h.name === name; })) {
      showToast('这个习惯已经添加过啦');
      return;
    }
    addHabit(name);
    inputEl.value = '';
    inputEl.focus();
  });

  /* ---------- init ---------- */

  renderDate();
  renderList();
  renderHistory();
  // 页面如果跨过午夜还开着，自动刷新日期与记录
  setInterval(function () { renderDate(); renderHistory(); renderWeek(); }, 60000);
})();
</script>

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
